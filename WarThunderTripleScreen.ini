; War Thunder Triple Screen
; Defaults for a centre 2560x1440 display and two 1920x1080 side displays
; promoted by NVIDIA DSR/DLDSR to an effective 2560x1440.

[Game]
; Leave blank to auto-detect the local War Thunder installation.
InstallRoot=
LauncherPath=
ProcessName=aces
AutoLaunchLauncher=true
RequireClosedBeforeConfig=true

[Layout]
; PrimaryRow selects the horizontal row that contains the primary monitor.
Mode=PrimaryRow
RequiredMonitors=3
RequirePrimaryInMiddle=true
RequireEqualHeight=true

[Display]
; If a side display is shorter than the primary, select an already exposed
; driver mode matching the primary resolution. This never creates a mode.
AutoPromoteToPrimary=true
Require100PercentScale=true
RestoreAfterGame=true

[Window]
WaitSeconds=240
RemoveBorders=true
StabilizeSeconds=45
IntervalMilliseconds=750
TolerancePixels=2
MaxCorrections=20

[Config]
Backup=true
Mode=windowed

